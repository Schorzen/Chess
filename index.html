<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PokéVault</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=17">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0d17">
<link rel="stylesheet" href="lobby.css?v=17">
<link rel="stylesheet" href="login.css?v=17">
</head>
<body>
<header id="top"><div class="tl"><button class="xb" id="bk" style="display:none" onclick="go('home')">‹ Lobby</button><div class="av" id="av"></div><div class="who"><b id="pname">Trainer</b><span id="plv"></span></div></div><div class="tr"><div class="pill" id="count"></div><button class="pill" id="so" style="display:none;font-family:inherit" onclick="cloud.out()">Sign out</button></div></header>
<div id="rotate"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg><h2>Rotate your phone</h2><p class="sub">PokéVault is played in landscape.</p><button class="go" onclick="goLandscape()" style="max-width:260px">Go fullscreen</button></div>
<main id="app"></main>
<div id="ov"><div class="pull" id="pull"></div><button class="pill" style="font-family:inherit;padding:10px 18px" onclick="document.querySelectorAll('.flip').forEach(e=>e.classList.add('open'));chk()">Flip all</button><button class="go" id="addb" style="max-width:520px" onclick="closeOv()">Add to collection</button></div>
<div id="dt"></div>
<div id="inv"></div>
<div id="arena"><div class="abox" id="ebox"><b id="enm"></b> <span id="edots"></span><div class="hp"><i id="ehb"></i></div></div><div class="sp" id="es"></div>
<div class="sp" id="ps"></div><div class="abox" id="pbox"><b id="pnm"></b> <span id="pdots"></span><div class="hp"><i id="phb"></i></div></div>
<div id="atxt"></div><button class="pill" id="askip" onclick="skipB=true">Skip</button><div id="ares"></div></div>
<div id="loginRoot"></div>
<nav>
<button id="n1" onclick="go('home')"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M12 8v4M10 10h4"/></svg>Packs</button>
<button id="n6" onclick="go('explore')"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6-7-11a7 7 0 0114 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Explore</button>
<button id="n4" onclick="go('battle')"><svg viewBox="0 0 24 24"><path d="M14 4l6-1-1 6-9 9-3-3zM4 20l4-4M6 14l4 4"/></svg>Battle</button>
<button id="n5" onclick="go('trade')"><svg viewBox="0 0 24 24"><path d="M7 7h13l-3-3M17 17H4l3 3"/></svg>Trade</button>
<button id="n3" onclick="go('top')"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0zM7 6H4v2a3 3 0 003 3M17 6h3v2a3 3 0 01-3 3"/></svg>Top</button>
<button id="n2" onclick="go('col')"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Collection</button>
</nav>
<script src="lobby.js?v=17"></script>
<script src="game.js?v=17"></script>
<script src="explore.js?v=17"></script>
<script src="duel.js?v=17"></script>
<script type="module" src="auth.js?v=17"></script>
<script type="module" src="login.js?v=17"></script>
</body>
</html>
